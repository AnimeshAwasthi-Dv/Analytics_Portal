<!doctype html>
<html lang="en">

      if (
        window.location.pathname !== "/" &&
        window.location.pathname !== "/login"
      ) {
        document.documentElement.classList.add("app-starting");
      }
    </script>
    <style>
      .initial-startup {
        display: none;
      }

      .app-starting .initial-startup {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background: #191d24;
        color: #b8c7d9;
        font:
          14px system-ui,
          sans-serif;
      }
    </style>
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dectrocel organization command: portal operations, service analytics, licensing and team access."
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>Dectrocel | Organization Command</title>
  </head>
  <body>
    <div id="root">
      <div class="initial-startup" role="status">
        Opening Dectrocel organization command...
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
